name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# Read-only by default; this workflow neither publishes nor writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22.x'
          cache: 'npm'

      # Tests live under __tests__/ which is gitignored, so they are not present on the
      # runner — the gate here is static verification (typecheck + lint) plus a full build.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:prod
